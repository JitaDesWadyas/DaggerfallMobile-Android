name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Unpack Android source
        shell: bash
        run: |
          set -euo pipefail
          unzip -o -q DaggerfallMobile-GitHubActions-input-test-v5.zip -d .
          test -f settings.gradle
          test -f gradlew
          test -f app/build.gradle
          cp patches/login-fix-v9.js app/src/main/assets/login-fix.js
          python3 patches/android-v9.py
          mkdir -p tests
          cp patches/login-fix-v6.test.cjs tests/login-fix-v6.test.cjs
          chmod +x gradlew
          echo 'Android source extracted successfully'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK from GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK directory: $SDK"
          ls -la "$SDK/cmdline-tools" || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: JavaScript tests
        run: |
          node --check app/src/main/assets/login-fix.js
          node --test tests/gamepad-shim.test.cjs tests/login-fix-v6.test.cjs
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          bash ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee android-build.log
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DaggerfallMobile-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-build.log
          if-no-files-found: ignore
